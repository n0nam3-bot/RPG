<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>DEPTH ARENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

  <!-- ===== AGE GATE ===== -->
  <div id="age-gate">
    <div class="age-gate-panel">
      <h1>DEPTH ARENA</h1>
      <p class="age-gate-sub">A dark arena fighter. Viewer discretion advised.</p>
      <p class="age-gate-text">
        This game contains stylized combat and dark fantasy themes.
        You must confirm you are <strong>18 years of age or older</strong> to continue.
      </p>
      <div class="age-gate-buttons">
        <button id="age-confirm">I am 18+ — Enter</button>
        <button id="age-deny">Leave</button>
      </div>
    </div>
  </div>

  <!-- ===== CANVAS ===== -->
  <canvas id="game-canvas"></canvas>
  <div id="fx-overlay"></div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div class="fighter-panel left">
      <div class="fighter-name" id="p1-name">THE PALADIN</div>
      <div class="bar health-bar"><div class="bar-fill" id="p1-health-fill"></div></div>
      <div class="bar meter-bar"><div class="bar-fill" id="p1-meter-fill"></div></div>
      <div class="round-pips" id="p1-pips"></div>
    </div>

    <div class="fighter-panel right">
      <div class="fighter-name" id="p2-name">OPPONENT</div>
      <div class="bar health-bar"><div class="bar-fill" id="p2-health-fill"></div></div>
      <div class="bar meter-bar"><div class="bar-fill" id="p2-meter-fill"></div></div>
      <div class="round-pips" id="p2-pips"></div>
    </div>

    <div class="hud-top-center">
      <div class="round-timer" id="round-timer">60</div>
      <div class="ladder-progress" id="ladder-progress">FIGHTER 1 / 7</div>
    </div>

    <div class="hud-center-msg" id="center-msg"></div>

    <!-- Touch controls, shown only on touch devices -->
    <div id="touch-controls" class="hidden">
      <div id="joystick-zone">
        <div id="joystick-base"><div id="joystick-knob"></div></div>
      </div>
      <div id="touch-buttons">
        <button id="btn-block" class="touch-btn block">BLOCK</button>
        <button id="btn-evade" class="touch-btn">EVADE</button>
        <button id="btn-light" class="touch-btn primary">LIGHT</button>
        <button id="btn-heavy" class="touch-btn heavy">HEAVY</button>
        <button id="btn-special" class="touch-btn special">SPECIAL</button>
      </div>
    </div>

    <div class="hud-hint" id="hud-hint"></div>
  </div>

  <!-- ===== END SCREENS ===== -->
  <div id="end-screen" class="hidden">
    <div class="end-panel">
      <h1 id="end-title">GAME OVER</h1>
      <p id="end-subtitle"></p>
      <div id="end-stats"></div>
      <button id="restart-btn">Restart Arcade</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
